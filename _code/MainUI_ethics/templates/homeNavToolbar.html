{#template MAIN}
<ul id="ulHomeNavToolbar" class="tabs2"> 
    {#foreach $T.d.Children as HomePageNode}
        <li class="">
			{#if $T.HomePageNode.SiteFolderName == $T.HomePageNode.DisplayName}
            <a href="#" onclick="doSiteFolderLink('{$T.HomePageNode.SiteFolderName}');"><img src="{$T.HomePageNode.ImageUrl}" alt="{$T.HomePageNode.DisplayName}" title="{$T.HomePageNode.DisplayName}" /></a>
			{#else}
			<a href="#" onclick="doLink('{$T.HomePageNode.SiteFolderName}','{$T.HomePageNode.SiteFolderName}');"><img src="{$T.HomePageNode.ImageUrl}" alt="{$T.HomePageNode.DisplayName}" title="{$T.HomePageNode.DisplayName}" /></a>
			{#/if}

        </li>
    {#/for}
</ul>

<ul class="forum">
    <!-- li class="first"><a href="#" onclick="doLinkToForum();"><img src="images/home-forum.gif" alt="Forum"  /></a></li> -->
</ul>
<form id="forumForm" action="" method="post" target="_blank">
    <input id="forumFormGuid" type="hidden" name="guid" value="" />
</form>
{#/template MAIN}
